name: Deploy to GitHub Pages

# The site lives AT the repo root (index.html, board/, play/, shared/,
# assets/, vendor/, join/, server/) so that BOTH deployment methods work:
# the Actions workflow below AND a plain "deploy from branch" Pages setting.
# The workflow is still preferred: it builds fresh vendor bundles and ships a
# clean artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; superseded runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build vendor bundles (peerjs, qrcode, jsQR)
        run: npm run build:vendor

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          # Site content (game pages, assets, vendor, and the isomorphic
          # server/ modules the board host imports in the browser).
          for d in board play shared assets vendor join server; do
            cp -r "$d" site/
          done
          cp index.html 404.html site/
          # Jekyll would try to process the site; we ship plain static files.
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
